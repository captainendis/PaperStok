name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # WPF (PaperStok.App) needs the Windows Desktop SDK, which only ships
    # as part of the .NET SDK on Windows — this cannot build on Linux/macOS.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore PaperStok.sln

      - name: Build
        run: dotnet build PaperStok.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/PaperStok.Core.Tests/PaperStok.Core.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish portable exe
        run: >
          dotnet publish src/PaperStok.App/PaperStok.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: PaperStok-portable-win-x64
          path: dist/PaperStok.exe
          if-no-files-found: error
